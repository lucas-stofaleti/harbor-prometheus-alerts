apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: harbor-alerts
  labels:
    app.kubernetes.io/name: harbor-alerts
spec:
  groups:
  - name: harbor.availability
    rules:
    - alert: HarborTargetDown
      expr: max without (instance, pod) (up{job=~".*harbor.*"}) == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Harbor metrics target unreachable
        description: All scrape targets of job {{ $labels.job }}{{ with $labels.service }}, service {{ . }}{{ end }}{{ with $labels.namespace }}, namespace {{ . }}{{ end }} have been down for 5 minutes. The Harbor component behind them is down or unreachable from Prometheus, and alerts that depend on its metrics cannot fire meanwhile.
    - alert: HarborComponentUnhealthy
      expr: max without (instance, pod) (harbor_up{component=~"core|database|redis|registry"}) == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Harbor {{ $labels.component }} is unhealthy
        description: Harbor's health check has reported {{ $labels.component }} as unhealthy for 5 minutes. This component is on the push/pull path, so clients are failing or about to fail.
    - alert: HarborAuxiliaryComponentUnhealthy
      expr: max without (instance, pod) (harbor_up{component!~"core|database|redis|registry"}) == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Harbor {{ $labels.component }} is unhealthy
        description: 'Harbor''s health check has reported {{ $labels.component }} as unhealthy for 15 minutes. Push and pull keep working, but the features this component backs are degraded. jobservice: replication, scanning, retention, GC, webhooks. portal: web UI. registryctl: garbage collection. trivy: vulnerability scanning, and projects that prevent vulnerable images refuse pulls of newly pushed, unscanned artifacts.'
  - name: harbor.requests
    rules:
    - alert: HarborErrorRateHigh
      expr: |
        (
            sum without (instance, pod, method, code, operation) (
              rate(harbor_core_http_request_total{code=~"5..", operation!~"(?i)getPing|getHealth|getSystemInfo"}[5m])
            )
          /
            sum without (instance, pod, method, code, operation) (
              rate(harbor_core_http_request_total{operation!~"(?i)getPing|getHealth|getSystemInfo"}[5m])
            )
        ) > 0.05
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: Harbor is failing {{ $value | humanizePercentage }} of requests
        description: 'More than 5% of client requests served by Harbor core (API, UI and the /v2 registry endpoints) have returned 5xx for 10 minutes. Break harbor_core_http_request_total down by operation and code: v2_* operations point at the registry or its storage backend, "unknown" covers the token service and requests rejected before routing.'
    - alert: HarborManifestLatencyHigh
      expr: |
        max without (instance, pod, method) (
          harbor_core_http_request_duration_seconds{operation="v2_manifest", method=~"GET|HEAD", quantile="0.9"}
        ) > 2
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Harbor manifest requests are slow (p90 {{ $value | humanizeDuration }})
        description: 'On the slowest Harbor core replica, the 90th percentile of manifest GET/HEAD requests has been above 2s for 10 minutes. Every image pull starts with these calls, so pulls and pod starts are slowing down. Usual suspects: database contention, slow registry storage, or a slow upstream registry behind a proxy-cache project.'
  - name: harbor.jobservice
    rules:
    - alert: HarborJobQueueStalled
      expr: |
        (max without (instance, pod) (harbor_task_queue_latency) > 1800)
        and
        (max without (instance, pod) (delta(harbor_task_queue_size[30m])) >= 0)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Harbor {{ $labels.type }} jobs are not being processed
        description: 'The oldest queued {{ $labels.type }} job has waited {{ $value | humanizeDuration }} and the queue has not shrunk in the last 30 minutes: jobservice is stuck or under-provisioned for this load. Expected if an administrator paused this queue in the Job Service Dashboard.'
  - name: harbor.capacity
    rules:
    - alert: HarborProjectQuotaNearlyFull
      expr: |
        max without (instance, pod) (
          harbor_project_quota_usage_byte / (harbor_project_quota_byte > 0)
        ) > 0.9
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Harbor project {{ $labels.project_name }} has used {{ $value | humanizePercentage }} of its quota
        description: Pushes to project {{ $labels.project_name }} will be rejected once its storage quota is reached. Raise the quota or delete artifacts (manually or through tag retention); quota usage drops as soon as artifacts are deleted.
