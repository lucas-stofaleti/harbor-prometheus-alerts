# Prometheus alerting rules for Harbor
# Checked against the Harbor v2.15.0 source (goharbor/harbor) and the harbor-helm chart.
# Unit tests: promtool test rules harbor-alerts.test.yaml
# prometheus-operator: put the `groups:` list under `spec:` of a PrometheusRule.
#
# Severity
#   critical  push/pull is failing or about to fail; page someone.
#   warning   a feature is degraded or a limit is approaching; ticket or chat.
#
# Selectors
#   harbor_* metric names are unique to Harbor, so those rules carry no job selector.
#   The only generic metric used is `up`, scoped with job=~".*harbor.*". That matches the
#   scrape jobs in the Harbor docs (harbor-core, harbor-registry, ...) and the harbor-helm
#   ServiceMonitor (job="harbor"). Change it if your scrape jobs are named differently.
#
# Aggregation
#   Rules aggregate with `without (instance, pod, ...)` rather than `by (...)`. Replicas
#   collapse into one series per Harbor deployment, while whatever topology labels your
#   setup attaches (cluster, namespace, service, env/tenant labels from relabeling) survive
#   for Alertmanager routing and grouping.

groups:
  - name: harbor.availability
    rules:
      # Every scrape target of a job/service is down. Catches a component that is fully down
      # (including core, whose outage cannot show up in harbor_up; see below) and a dead
      # exporter, which would otherwise silently disable the health, queue and quota alerts.
      - alert: HarborTargetDown
        expr: max without (instance, pod) (up{job=~".*harbor.*"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Harbor metrics target unreachable"
          description: >-
            All scrape targets of job {{ $labels.job }}{{ with $labels.service }}, service {{ . }}{{ end }}{{ with $labels.namespace }}, namespace {{ . }}{{ end }}
            have been down for 5 minutes. The Harbor component behind them is down or unreachable
            from Prometheus, and alerts that depend on its metrics cannot fire meanwhile.

      # harbor_up comes from core's health API, polled by the exporter. "core" is included
      # for completeness, but in Harbor v2.15 its checker is a no-op that always reports
      # healthy: when core is down the exporter drops the harbor_up series instead of
      # reporting 0, and HarborTargetDown is what catches it. Database and redis outages
      # usually take the exporter's own metrics down as well, so they also tend to show up
      # as HarborTargetDown on the exporter rather than here.
      - alert: HarborComponentUnhealthy
        expr: max without (instance, pod) (harbor_up{component=~"core|database|redis|registry"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Harbor {{ $labels.component }} is unhealthy"
          description: >-
            Harbor's health check has reported {{ $labels.component }} as unhealthy for 5 minutes.
            This component is on the push/pull path, so clients are failing or about to fail.

      - alert: HarborAuxiliaryComponentUnhealthy
        expr: max without (instance, pod) (harbor_up{component!~"core|database|redis|registry"}) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Harbor {{ $labels.component }} is unhealthy"
          description: >-
            Harbor's health check has reported {{ $labels.component }} as unhealthy for 15 minutes.
            Push and pull keep working, but the features this component backs are degraded.
            jobservice: replication, scanning, retention, GC, webhooks. portal: web UI.
            registryctl: garbage collection. trivy: vulnerability scanning, and projects that
            prevent vulnerable images refuse pulls of newly pushed, unscanned artifacts.

  - name: harbor.requests
    rules:
      # Core fronts every client request, including all /v2 registry traffic it proxies, so its
      # error ratio is the user-facing symptom. Kubelet probes (getPing) and the exporter's
      # polling (getHealth and getSystemInfo, called together every ~30s) are excluded so
      # synthetic 200s cannot mask real failures on low-traffic instances. Operation names
      # are matched case-insensitively because core reports them capitalised (GetPing).
      - alert: HarborErrorRateHigh
        expr: |
          (
              sum without (instance, pod, method, code, operation) (
                rate(harbor_core_http_request_total{code=~"5..", operation!~"(?i)getPing|getHealth|getSystemInfo"}[5m])
              )
            /
              sum without (instance, pod, method, code, operation) (
                rate(harbor_core_http_request_total{operation!~"(?i)getPing|getHealth|getSystemInfo"}[5m])
              )
          ) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Harbor is failing {{ $value | humanizePercentage }} of requests"
          description: >-
            More than 5% of client requests served by Harbor core (API, UI and the /v2 registry
            endpoints) have returned 5xx for 10 minutes. Break harbor_core_http_request_total down
            by operation and code: v2_* operations point at the registry or its storage backend,
            "unknown" covers the token service and requests rejected before routing.

      # Manifest GET/HEAD is small, size-independent and starts every pull, so its latency is
      # comparable across environments (blob latency depends on layer size and is not).
      # The metric is a summary, so quantiles cannot be aggregated across replicas; the alert
      # uses the slowest replica.
      - alert: HarborManifestLatencyHigh
        expr: |
          max without (instance, pod, method) (
            harbor_core_http_request_duration_seconds{operation="v2_manifest", method=~"GET|HEAD", quantile="0.9"}
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Harbor manifest requests are slow (p90 {{ $value | humanizeDuration }})"
          description: >-
            On the slowest Harbor core replica, the 90th percentile of manifest GET/HEAD requests has
            been above 2s for 10 minutes. Every image pull starts with these calls, so pulls and
            pod starts are slowing down. Usual suspects: database contention, slow registry
            storage, or a slow upstream registry behind a proxy-cache project.

  - name: harbor.jobservice
    rules:
      # Queue latency alone fires on every large "scan all", which legitimately queues hours of
      # work. Requiring that the queue has not shrunk in 30 minutes separates a busy queue
      # (draining) from a stuck or under-provisioned one.
      - alert: HarborJobQueueStalled
        expr: |
          (max without (instance, pod) (harbor_task_queue_latency) > 1800)
          and
          (max without (instance, pod) (delta(harbor_task_queue_size[30m])) >= 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Harbor {{ $labels.type }} jobs are not being processed"
          description: >-
            The oldest queued {{ $labels.type }} job has waited {{ $value | humanizeDuration }} and the
            queue has not shrunk in the last 30 minutes: jobservice is stuck or under-provisioned
            for this load. Expected if an administrator paused this queue in the Job Service Dashboard.

  - name: harbor.capacity
    rules:
      # Projects without a quota report -1 and are filtered out by "> 0".
      - alert: HarborProjectQuotaNearlyFull
        expr: |
          max without (instance, pod) (
            harbor_project_quota_usage_byte / (harbor_project_quota_byte > 0)
          ) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Harbor project {{ $labels.project_name }} has used {{ $value | humanizePercentage }} of its quota"
          description: >-
            Pushes to project {{ $labels.project_name }} will be rejected once its storage quota is
            reached. Raise the quota or delete artifacts (manually or through tag retention);
            quota usage drops as soon as artifacts are deleted.