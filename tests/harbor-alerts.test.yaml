# promtool unit tests for harbor-alerts.yaml
# Run: promtool test rules harbor-alerts.test.yaml
rule_files:
  - ../rules/harbor-alerts.yaml

evaluation_interval: 1m

tests:
  # Fires only when every target of a group is down; ignores partial outages and non-Harbor jobs.
  # Covers both label layouts: harbor-helm ServiceMonitor and docker-compose static scrape jobs.
  - name: HarborTargetDown
    interval: 1m
    input_series:
      - series: 'up{job="harbor", namespace="harbor", service="harbor-core", instance="10.0.0.1:8001", pod="harbor-core-1"}'
        values: '0x15'
      - series: 'up{job="harbor", namespace="harbor", service="harbor-core", instance="10.0.0.2:8001", pod="harbor-core-2"}'
        values: '1x15'
      - series: 'up{job="harbor", namespace="harbor", service="harbor-exporter", instance="10.0.0.3:8001", pod="harbor-exporter-1"}'
        values: '0x15'
      - series: 'up{job="harbor-registry", instance="harbor.example.com:9090"}'
        values: '1 1 1 1 1 0x10'
      - series: 'up{job="node-exporter", instance="node1:9100"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 3m
        alertname: HarborTargetDown
        exp_alerts: []
      - eval_time: 12m
        alertname: HarborTargetDown
        exp_alerts:
          - exp_labels: {severity: critical, job: harbor, namespace: harbor, service: harbor-exporter}
            exp_annotations:
              summary: "Harbor metrics target unreachable"
              description: "All scrape targets of job harbor, service harbor-exporter, namespace harbor have been down for 5 minutes. The Harbor component behind them is down or unreachable from Prometheus, and alerts that depend on its metrics cannot fire meanwhile."
          - exp_labels: {severity: critical, job: harbor-registry}
            exp_annotations:
              summary: "Harbor metrics target unreachable"
              description: "All scrape targets of job harbor-registry have been down for 5 minutes. The Harbor component behind them is down or unreachable from Prometheus, and alerts that depend on its metrics cannot fire meanwhile."

  # Datapath components (core, database, redis, registry) page after 5m.
  # Auxiliary components are not evaluated here, see HarborAuxiliaryComponentUnhealthy below.
  # core: down from the start -> fires. database: down from minute 2 -> still pending at 4m.
  # registry: healthy -> silent. trivy: unhealthy, but auxiliary -> ignored by this alert.
  - name: HarborComponentUnhealthy
    interval: 1m
    input_series:
      - series: 'harbor_up{job="harbor", namespace="harbor", service="harbor-exporter", instance="e", pod="exporter-1", component="core"}'
        values: '0x30'
      - series: 'harbor_up{job="harbor", namespace="harbor", service="harbor-exporter", instance="e", pod="exporter-1", component="database"}'
        values: '1 1 0x30'
      - series: 'harbor_up{job="harbor", namespace="harbor", service="harbor-exporter", instance="e", pod="exporter-1", component="registry"}'
        values: '1x30'
      - series: 'harbor_up{job="harbor", namespace="harbor", service="harbor-exporter", instance="e", pod="exporter-1", component="trivy"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 4m # nothing has been down for 5m yet
        alertname: HarborComponentUnhealthy
        exp_alerts: []
      - eval_time: 10m
        alertname: HarborComponentUnhealthy
        exp_alerts:
          - exp_labels: {severity: critical, job: harbor, namespace: harbor, service: harbor-exporter, component: core}
            exp_annotations:
              summary: "Harbor core is unhealthy"
              description: "Harbor's health check has reported core as unhealthy for 5 minutes. This component is on the push/pull path, so clients are failing or about to fail."
          - exp_labels: {severity: critical, job: harbor, namespace: harbor, service: harbor-exporter, component: database}
            exp_annotations:
              summary: "Harbor database is unhealthy"
              description: "Harbor's health check has reported database as unhealthy for 5 minutes. This component is on the push/pull path, so clients are failing or about to fail."

  # Auxiliary components warn after 15m. Any component that is not core, database, redis or
  # registry lands here, including ones Harbor may add later ("scanner-x").
  # trivy and scanner-x: down from the start -> fire at 20m, silent at 10m.
  # portal: healthy -> silent. database: datapath component -> never evaluated by this alert.
  - name: HarborAuxiliaryComponentUnhealthy
    interval: 1m
    input_series:
      - series: 'harbor_up{job="harbor", namespace="harbor", service="harbor-exporter", instance="e", pod="exporter-1", component="trivy"}'
        values: '0x30'
      - series: 'harbor_up{job="harbor", namespace="harbor", service="harbor-exporter", instance="e", pod="exporter-1", component="scanner-x"}'
        values: '0x30'
      - series: 'harbor_up{job="harbor", namespace="harbor", service="harbor-exporter", instance="e", pod="exporter-1", component="portal"}'
        values: '1x30'
      - series: 'harbor_up{job="harbor", namespace="harbor", service="harbor-exporter", instance="e", pod="exporter-1", component="database"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: HarborAuxiliaryComponentUnhealthy
        exp_alerts: []
      - eval_time: 20m
        alertname: HarborAuxiliaryComponentUnhealthy
        exp_alerts:
          - exp_labels: {severity: warning, job: harbor, namespace: harbor, service: harbor-exporter, component: scanner-x}
            exp_annotations:
              summary: "Harbor scanner-x is unhealthy"
              description: "Harbor's health check has reported scanner-x as unhealthy for 15 minutes. Push and pull keep working, but the features this component backs are degraded. jobservice: replication, scanning, retention, GC, webhooks. portal: web UI. registryctl: garbage collection. trivy: vulnerability scanning, and projects that prevent vulnerable images refuse pulls of newly pushed, unscanned artifacts."
          - exp_labels: {severity: warning, job: harbor, namespace: harbor, service: harbor-exporter, component: trivy}
            exp_annotations:
              summary: "Harbor trivy is unhealthy"
              description: "Harbor's health check has reported trivy as unhealthy for 15 minutes. Push and pull keep working, but the features this component backs are degraded. jobservice: replication, scanning, retention, GC, webhooks. portal: web UI. registryctl: garbage collection. trivy: vulnerability scanning, and projects that prevent vulnerable images refuse pulls of newly pushed, unscanned artifacts."

  # prod: ~9% 5xx across two replicas -> fires.
  # small: 50% of real traffic fails, but would sit below 5% if kubelet probes were counted -> fires.
  # healthy: 1% 5xx -> silent.
  # capitalised: the operation names core really reports (GetPing, GetHealth, GetSystemInfo, as seen on
  #   Harbor 2.15). 50% of real traffic fails; counting the three probes (72 requests/min of 200s)
  #   would dilute it to ~2.7% and hide it, so this fires only if all three are excluded, case-insensitively.
  - name: HarborErrorRateHigh
    interval: 1m
    input_series:
      - series: 'harbor_core_http_request_total{job="harbor", namespace="capitalised", service="harbor-core", instance="f", pod="core-1", method="GET", code="200", operation="v2_manifest"}'
        values: '0+1x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="capitalised", service="harbor-core", instance="f", pod="core-1", method="GET", code="500", operation="v2_manifest"}'
        values: '0+1x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="capitalised", service="harbor-core", instance="f", pod="core-1", method="GET", code="200", operation="GetPing"}'
        values: '0+24x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="capitalised", service="harbor-core", instance="f", pod="core-1", method="GET", code="200", operation="GetHealth"}'
        values: '0+24x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="capitalised", service="harbor-core", instance="f", pod="core-1", method="GET", code="200", operation="GetSystemInfo"}'
        values: '0+24x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="prod", service="harbor-core", instance="a", pod="core-1", method="GET", code="200", operation="v2_manifest"}'
        values: '0+100x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="prod", service="harbor-core", instance="b", pod="core-2", method="GET", code="200", operation="v2_manifest"}'
        values: '0+100x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="prod", service="harbor-core", instance="a", pod="core-1", method="GET", code="500", operation="v2_blob"}'
        values: '0+10x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="prod", service="harbor-core", instance="b", pod="core-2", method="GET", code="503", operation="v2_blob"}'
        values: '0+10x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="small", service="harbor-core", instance="c", pod="core-1", method="GET", code="200", operation="v2_manifest"}'
        values: '0+1x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="small", service="harbor-core", instance="c", pod="core-1", method="GET", code="500", operation="v2_manifest"}'
        values: '0+1x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="small", service="harbor-core", instance="c", pod="core-1", method="GET", code="200", operation="getPing"}'
        values: '0+24x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="healthy", service="harbor-core", instance="d", pod="core-1", method="GET", code="200", operation="listProjects"}'
        values: '0+99x30'
      - series: 'harbor_core_http_request_total{job="harbor", namespace="healthy", service="harbor-core", instance="d", pod="core-1", method="GET", code="500", operation="listProjects"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: HarborErrorRateHigh
        exp_alerts:
          - exp_labels: {severity: critical, job: harbor, namespace: capitalised, service: harbor-core}
            exp_annotations:
              summary: "Harbor is failing 50% of requests"
              description: 'More than 5% of client requests served by Harbor core (API, UI and the /v2 registry endpoints) have returned 5xx for 10 minutes. Break harbor_core_http_request_total down by operation and code: v2_* operations point at the registry or its storage backend, "unknown" covers the token service and requests rejected before routing.'
          - exp_labels: {severity: critical, job: harbor, namespace: prod, service: harbor-core}
            exp_annotations:
              summary: "Harbor is failing 9.091% of requests"
              description: 'More than 5% of client requests served by Harbor core (API, UI and the /v2 registry endpoints) have returned 5xx for 10 minutes. Break harbor_core_http_request_total down by operation and code: v2_* operations point at the registry or its storage backend, "unknown" covers the token service and requests rejected before routing.'
          - exp_labels: {severity: critical, job: harbor, namespace: small, service: harbor-core}
            exp_annotations:
              summary: "Harbor is failing 50% of requests"
              description: 'More than 5% of client requests served by Harbor core (API, UI and the /v2 registry endpoints) have returned 5xx for 10 minutes. Break harbor_core_http_request_total down by operation and code: v2_* operations point at the registry or its storage backend, "unknown" covers the token service and requests rejected before routing.'

  # Slowest replica's manifest p90 is 3s -> fires; blob, p99, PUT and idle (NaN) series are ignored.
  # The PUT series (5s) is slower than the 3s GET: if PUT were counted the summary would read 5s.
  # Manifest PUT includes quota and scan hooks, so it is slow for reasons unrelated to pulls.
  - name: HarborManifestLatencyHigh
    interval: 1m
    input_series:
      - series: 'harbor_core_http_request_duration_seconds{job="harbor", namespace="prod", service="harbor-core", instance="a", pod="core-1", method="PUT", operation="v2_manifest", quantile="0.9"}'
        values: '5x20'
      - series: 'harbor_core_http_request_duration_seconds{job="harbor", namespace="prod", service="harbor-core", instance="a", pod="core-1", method="GET", operation="v2_manifest", quantile="0.9"}'
        values: '3x20'
      - series: 'harbor_core_http_request_duration_seconds{job="harbor", namespace="prod", service="harbor-core", instance="a", pod="core-1", method="HEAD", operation="v2_manifest", quantile="0.9"}'
        values: '0.2x20'
      - series: 'harbor_core_http_request_duration_seconds{job="harbor", namespace="prod", service="harbor-core", instance="b", pod="core-2", method="GET", operation="v2_manifest", quantile="0.9"}'
        values: '0.3x20'
      - series: 'harbor_core_http_request_duration_seconds{job="harbor", namespace="prod", service="harbor-core", instance="b", pod="core-2", method="GET", operation="v2_manifest", quantile="0.99"}'
        values: '10x20'
      - series: 'harbor_core_http_request_duration_seconds{job="harbor", namespace="prod", service="harbor-core", instance="b", pod="core-2", method="GET", operation="v2_blob", quantile="0.9"}'
        values: '30x20'
      - series: 'harbor_core_http_request_duration_seconds{job="harbor", namespace="idle", service="harbor-core", instance="c", pod="core-1", method="GET", operation="v2_manifest", quantile="0.9"}'
        values: 'NaN+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HarborManifestLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: harbor, namespace: prod, service: harbor-core, operation: v2_manifest, quantile: "0.9"}
            exp_annotations:
              summary: "Harbor manifest requests are slow (p90 3s)"
              description: "On the slowest Harbor core replica, the 90th percentile of manifest GET/HEAD requests has been above 2s for 10 minutes. Every image pull starts with these calls, so pulls and pod starts are slowing down. Usual suspects: database contention, slow registry storage, or a slow upstream registry behind a proxy-cache project."

  # REPLICATION: oldest job keeps ageing and the queue never shrinks -> fires.
  # IMAGE_SCAN: huge "scan all" backlog that keeps draining -> silent.
  - name: HarborJobQueueStalled
    interval: 1m
    input_series:
      - series: 'harbor_task_queue_latency{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", type="REPLICATION"}'
        values: '1500+60x60'
      - series: 'harbor_task_queue_size{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", type="REPLICATION"}'
        values: '5x60'
      - series: 'harbor_task_queue_latency{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", type="IMAGE_SCAN"}'
        values: '3600+60x60'
      - series: 'harbor_task_queue_size{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", type="IMAGE_SCAN"}'
        values: '10000-50x60'
    alert_rule_test:
      - eval_time: 15m
        alertname: HarborJobQueueStalled
        exp_alerts: []
      - eval_time: 40m
        alertname: HarborJobQueueStalled
        exp_alerts:
          - exp_labels: {severity: warning, job: harbor, namespace: prod, service: harbor-exporter, type: REPLICATION}
            exp_annotations:
              summary: "Harbor REPLICATION jobs are not being processed"
              description: "The oldest queued REPLICATION job has waited 1h 5m 0s and the queue has not shrunk in the last 30 minutes: jobservice is stuck or under-provisioned for this load. Expected if an administrator paused this queue in the Job Service Dashboard."

  # team-a at 95% -> fires; team-b at 50% and unlimited (-1) projects -> silent.
  - name: HarborProjectQuotaNearlyFull
    interval: 1m
    input_series:
      - series: 'harbor_project_quota_usage_byte{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", project_name="team-a"}'
        values: '95x30'
      - series: 'harbor_project_quota_byte{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", project_name="team-a"}'
        values: '100x30'
      - series: 'harbor_project_quota_usage_byte{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", project_name="team-b"}'
        values: '50x30'
      - series: 'harbor_project_quota_byte{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", project_name="team-b"}'
        values: '100x30'
      - series: 'harbor_project_quota_usage_byte{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", project_name="library"}'
        values: '500x30'
      - series: 'harbor_project_quota_byte{job="harbor", namespace="prod", service="harbor-exporter", instance="e", pod="exporter-1", project_name="library"}'
        values: '-1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: HarborProjectQuotaNearlyFull
        exp_alerts:
          - exp_labels: {severity: warning, job: harbor, namespace: prod, service: harbor-exporter, project_name: team-a}
            exp_annotations:
              summary: "Harbor project team-a has used 95% of its quota"
              description: "Pushes to project team-a will be rejected once its storage quota is reached. Raise the quota or delete artifacts (manually or through tag retention); quota usage drops as soon as artifacts are deleted."